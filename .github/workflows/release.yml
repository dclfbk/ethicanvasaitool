# Builds the desktop packages for Linux and Windows.
# Push a tag such as v0.2.0, or start it by hand from the Actions tab:
# the packages are attached to a draft release to review before publishing.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Builds the signed update artifacts and attaches latest.json to the release.
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build', github.run_number) }}
          releaseName: EthiCanvas AI ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: Desktop packages for Linux (deb, rpm, AppImage) and Windows (msi, exe). Not code-signed; updates are signed with the updater key.
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}

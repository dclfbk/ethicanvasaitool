# Builds the desktop packages for Linux, Windows and macOS (one universal app for Apple silicon and Intel).
# Push a tag such as v0.2.0, or start it by hand from the Actions tab:
# the packages are attached to a draft release to review before publishing.
# macOS packages are signed and notarised only when the Apple secrets below are set; otherwise they are built unsigned.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      # Secrets cannot be tested in "if": this flag says whether the Developer ID certificate is available.
      APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # Developer ID signing and notarisation (Apple Developer Program). Exported only when set, because an empty
      # certificate makes the bundler fail instead of skipping the signature.
      - name: Enable Apple signing and notarisation
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OAuth clients for the cloud archive, compiled into the Rust side; unset means unavailable.
          CANVAS_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          CANVAS_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          CANVAS_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
          CANVAS_MS_TENANT: ${{ vars.MS_TENANT }}
        with:
          # Builds the signed update artifacts and attaches latest.json to the release.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build', github.run_number) }}
          releaseName: EthiCanvas AI ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: Desktop packages for Linux (deb, rpm, AppImage), Windows (msi, exe) and macOS (universal dmg and app). Windows packages are not code-signed; macOS packages are signed and notarised only when the Apple secrets are configured. Updates are signed with the updater key.
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}

# Builds the desktop packages for Linux and Windows.
# Push a tag such as v0.2.0, or start it by hand from the Actions tab:
# the packages are attached to a draft release to review before publishing.
# Alpha versions omit RPM and MSI because those formats reject SemVer prereleases.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            alpha_bundles: deb,appimage
          - platform: windows-latest
            alpha_bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Detect prerelease package version
        id: package-version
        shell: bash
        run: |
          node -e "console.log('is_prerelease=' + require('./src-tauri/tauri.conf.json').version.includes('-'))" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OAuth clients for the cloud archive, compiled into the Rust side; unset means unavailable.
          CANVAS_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          CANVAS_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          CANVAS_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
          CANVAS_MS_TENANT: ${{ vars.MS_TENANT }}
        with:
          # Builds the signed update artifacts and attaches latest.json to the release.
          args: >-
            --config src-tauri/tauri.release.conf.json
            ${{ steps.package-version.outputs.is_prerelease == 'true' && format('--bundles {0}', matrix.alpha_bundles) || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-build', github.run_number) }}
          releaseName: EthiCanvas AI ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseBody: >-
            ${{ steps.package-version.outputs.is_prerelease == 'true' &&
            'Pre-release alpha: versione sperimentale e instabile, da usare solo per la revisione e non per attività operative o dati reali. Pacchetti: Linux (.deb, AppImage) e Windows (.exe); RPM e MSI sono esclusi per incompatibilità con le versioni prerelease.' ||
            'Desktop packages for Linux (deb, rpm, AppImage) and Windows (msi, exe). Not code-signed; updates are signed with the updater key.' }}
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
